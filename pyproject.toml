[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-triforce"
version = "0.1.0"
description = "Jarvis Trinity — three-agent AGI architecture powered by Google ADK"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.25.0",
    "pydantic",
    "python-dotenv",
    "pyyaml",
]

[project.optional-dependencies]
memory = [
    "sentence-transformers",
    "grafeo",
]
memory-full = [
    "jarvis-triforce[memory]",
    "graphiti-core",
    "kuzu",
]
temporal = [
    "temporalio",
    "google-genai",
]
all = [
    "jarvis-triforce[memory]",
    "jarvis-triforce[temporal]",
]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
